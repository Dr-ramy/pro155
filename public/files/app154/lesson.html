<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المهمة الاستقصائية | بيئة نموذج درايفر التفاعلية</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/activities.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <nav class="app-navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="units.html" class="brand-wrapper">
        <div class="brand-icon">
          <i class="bi bi-compass"></i>
        </div>
        <div>
          <div class="brand-title" id="navTopicTitle">جاري تحميل المهمة...</div>
          <div class="brand-subtitle" id="navUnitTitle">برنامج الجغرافيا التفاعلي - نموذج درايفر</div>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="units.html" class="btn btn-sm btn-outline-light"><i class="bi bi-grid"></i> الوحدات</a>
        <button class="btn btn-sm btn-light" onclick="ActivityEngine.openVerificationLensModal()" title="عدسة التحقق السريعة">
          <i class="bi bi-search text-warning"></i> <span class="d-none d-sm-inline">عدسة التحقق</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- شريط رحلة نموذج درايفر (Driver Stepper) -->
  <header class="driver-journey-container">
    <div class="driver-stepper" id="driverStepper">
      <!-- يتم توليد المراحل ديناميكياً بواسطة DriverEngine -->
    </div>
  </header>

  <!-- الحاوية المركزية للنشاط والمرحلة -->
  <main class="container py-4 flex-grow-1">
    <div id="stageContainer">
      <!-- يتم حقن محتوى المرحلة الحالية هنا -->
    </div>
  </main>

  <!-- الزر العائم لعدسة التحقق -->
  <button class="lens-floating-trigger" onclick="ActivityEngine.openVerificationLensModal()" title="اضغط لفتح عدسة التحقق من الأخبار والمصادر">
    <i class="bi bi-search"></i>
    <span>عدسة التحقق</span>
    <span class="badge bg-light text-dark rounded-pill ms-1" id="floatingLensScore">0%</span>
  </button>

  <footer class="app-footer">
    <div class="container text-center">
      <p class="mb-0 text-muted small">بيئة تعلم تفاعلية قائمة على نموذج درايفر | تعتمد على الذاكرة اللحظية للجلسة بدون قاعدة بيانات</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data/units-data.js"></script>
  <script src="js/data/lesson-water.js"></script>
  <script src="js/data/lesson-road.js"></script>
  <script src="js/state.js"></script>
  <script src="js/feedback-engine.js"></script>
  <script src="js/scoring-engine.js"></script>
  <script src="js/activity-engine.js"></script>
  <script src="js/driver-engine.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // قراءة معرف المهمة من رابط الصفحة (?lesson=...)
      const urlParams = new URLSearchParams(window.location.search);
      const lessonParam = urlParams.get('lesson') || 'water-crisis';

      let currentLesson = LESSON_WATER_DATA;
      if (lessonParam === 'development-road' && typeof LESSON_ROAD_DATA !== 'undefined') {
        currentLesson = LESSON_ROAD_DATA;
      }

      // تحديث العناوين في الشريط العلوي
      const titleEl = document.getElementById("navTopicTitle");
      if (titleEl) titleEl.innerText = currentLesson.title;

      // تهيئة الحالة ومحرك درايفر
      AppState.init(currentLesson);
      DriverEngine.init(currentLesson);

      // تحديث مؤشر العدسة العائمة
      const floatingScore = document.getElementById("floatingLensScore");
      if (floatingScore) floatingScore.innerText = `${AppState.verificationScore}%`;
    });
  </script>
</body>
</html>
